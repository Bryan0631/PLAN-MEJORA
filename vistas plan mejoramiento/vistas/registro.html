<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Hilton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style_registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="register-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card register-card shadow p-4 p-md-5">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                    <h2 class="card-title fw-bold">Crea Tu Cuenta Hilton</h2>
                    <p class="text-muted">Únete a nuestra comunidad y disfruta de beneficios exclusivos.</p>
                </div>
                <form>
                    <div class="mb-3">
                        <label for="fullNameInput" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="fullNameInput" placeholder="Tu Nombre Completo" required>
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="emailInput" placeholder="tu@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="passwordInput" placeholder="Crea tu contraseña" required>
                        <small id="passwordHelp" class="form-text text-muted">Mínimo 8 caracteres, incluye letras y números.</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPasswordInput" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Repite tu contraseña" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="termsCheck" required>
                        <label class="form-check-label" for="termsCheck">Acepto los <a href="#" class="text-decoration-none">Términos y Condiciones</a></label>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
                    </div>
                    <div class="text-center mt-3">
                        <p class="mb-0">¿Ya tienes una cuenta?</p>
                        <a href="login.html" class="text-decoration-none fw-bold">Inicia Sesión Aquí</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
